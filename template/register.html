{% extends 'layout.html' %} {% block content %}
<div class="container">
  <div class="card">
    <div class="card-header">Create new account</div>
    <div class="card-body">
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Email</label>
            <input
              type="text"
              class="form-control"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-group col-md-6">
            <label>Username</label>
            <input
              type="text"
              class="form-control"
              name="username"
              autocomplete="username"
              required
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label> First Name</label>
            <input
              type="text"
              class="form-control"
              name="first_name"
              autocomplete="first_name"
              required
            />
          </div>
          <div class="form-group col-md-6">
            <label>Last Name</label>
            <input
              type="text"
              class="form-control"
              name="last_name"
              autocomplete="last_name"
              required
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label> Role</label>
            <select
              class="form-select form-control"
              name="role"
              autocomplete="role"
              required
            >
              <option value="user">User</option>
              <option value="admin">Role</option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>Phone Number</label>
            <input
              type="text"
              class="form-control"
              name="phone_number"
              autocomplete="phone_number"
              required
            />
          </div>
        </div>
        <div class="form-group">
          <label> Password</label>
          <input
            type="password"
            class="form-control"
            name="password"
            autocomplete="password"
            required
          />
        </div>
        <div class="form-group">
          <label> Verify Password</label>
          <input
            type="password"
            class="form-control"
            name="password2"
            autocomplete="password2"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
    </div>
    <div class="card-footer text-muted">
      <a href="/auth/login-page">Already have an account?</a>
    </div>
  </div>
</div>
{% endblock %}
