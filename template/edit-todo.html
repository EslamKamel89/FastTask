{% include 'layout.html' %}
<div class="container">
  <div class="card">
    <div class="card-header">Add todo</div>
    <div class="card-body">
      <form id="editTodoForm">
        <div class="form-group">
          <label>Title</label>
          <input
            type="text"
            class="form-control"
            name="title"
            required
            value="{{ todo.title }}"
          />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea
            type="text"
            class="form-control"
            rows="3"
            name="description"
            required
          >
{{ todo.description }}</textarea
          >
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select
            value="{{ todo.priority }}"
            type="text"
            class="form-control"
            name="priority"
            required
          >
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Todo</button>
        <a href="/todos/todo-page" class="btn btn-success">Back</a>
      </form>
    </div>
  </div>
</div>
